# ../release.sh creates release v<N> with the APK; its tag triggers this, which adds the Windows installer built as
# version N. Until it's attached, the Windows app simply doesn't see the update yet.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME is not v<number>"; exit 1; }
          echo "RXCONNECT_VERSION=$v" >> "$GITHUB_ENV"
      - name: Rust
        run: rustup update stable && rustup default stable
      - name: Test
        run: cargo test --release
      - name: Build installer
        run: npx --yes @tauri-apps/cli@2 build --config "{\"version\":\"$RXCONNECT_VERSION.0.0\"}"
      - name: Upload
        run: |
          cp target/release/bundle/nsis/*-setup.exe rxconnect-windows-x86_64-setup.exe
          # Same installer under the old portable exe's name: v1/v2 download that and run it, which installs the app.
          cp rxconnect-windows-x86_64-setup.exe rxconnect-windows-x86_64.exe
          gh release upload "$GITHUB_REF_NAME" rxconnect-windows-x86_64-setup.exe rxconnect-windows-x86_64.exe
        env:
          GH_TOKEN: ${{ github.token }}
